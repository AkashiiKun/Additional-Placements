plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

def commonResources = file("../common/src/main/resources")
def generatedResources = file("../common/src/generated")

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners.set(true)
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "mixins.additionalplacements.json"
    }

    runs {
        data {
            data()
            programArgs "--all", "--mod", "additionalplacements"
            programArgs "--existing", commonResources.absolutePath
            programArgs "--output", generatedResources.absolutePath
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-forge:$rootProject.forge_config_api_port_version"

    modCompileOnly "maven.modrinth:double-slabs:$doubleslabs_version"
    modImplementation "maven.modrinth:balm:$balm_version"
    modImplementation "maven.modrinth:kleeslabs:$kleeslabs_version"
    //modCompileOnly "maven.modrinth:continuity:$continuity_version"
    //modCompileOnly "curse.maven:ctm-267602:$ctm_file"

    modCompileOnly("com.simibubi.create:create-$create_mc_version:$create_version:slim") { transitive = false }
    modCompileOnly "net.createmod.ponder:Ponder-Forge-$create_mc_version:$ponder_version"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-$create_mc_version:$flywheel_version"
    //modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-$create_mc_version:$flywheel_version"
    modCompileOnly "com.tterrag.registrate:Registrate:$registrate_version"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.0"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
