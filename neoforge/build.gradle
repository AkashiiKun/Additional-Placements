plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def commonResources = file("../common/src/main/resources")
def generatedResources = file("../common/src/generated")

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            clientData()
            programArgs "--all", "--mod", "additionalplacements"
            programArgs "--existing", commonResources.absolutePath
            programArgs "--output", generatedResources.absolutePath
        }
    }
}

remapJar {
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //modCompileOnly "maven.modrinth:double-slabs:$doubleslabs_version"
    modImplementation "maven.modrinth:balm:$balm_version"
    modImplementation "maven.modrinth:kleeslabs:$kleeslabs_version"
    //modCompileOnly "maven.modrinth:continuity:$continuity_version"
    //modCompileOnly "curse.maven:ctm-267602:$ctm_file"

    //modImplementation("com.simibubi.create:create-$create_mc_version:$create_version:slim") { transitive = false }
    //modImplementation "net.createmod.ponder:ponder-neoforge:$ponder_version+mc$create_mc_version"
    //modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-$create_mc_version:$flywheel_version"
    //modRuntimeOnly "dev.engine-room.flywheel:flywheel-neoforge-$create_mc_version:$flywheel_version"
    //modImplementation "com.tterrag.registrate:Registrate:$registrate_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
