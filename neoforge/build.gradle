import dev.architectury.at.AccessTransformSet
import dev.architectury.at.io.AccessTransformFormats
import dev.architectury.loom.accesstransformer.Aw2At
import dev.architectury.loom.util.LfWriter

import java.nio.charset.StandardCharsets
import java.nio.file.Files

plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def commonResources = file("../common/src/main/resources")
def generatedResources = file("../common/src/generated")

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            clientData()
            programArgs "--all", "--mod", "additionalplacements"
            programArgs "--existing", commonResources.absolutePath
            programArgs "--output", generatedResources.absolutePath
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //compileOnly "maven.modrinth:double-slabs:$doubleslabs_version"
    implementation "maven.modrinth:balm:$balm_version"
    implementation "maven.modrinth:kleeslabs:$kleeslabs_version"
    //compileOnly "maven.modrinth:continuity:$continuity_version"
    //compileOnly "curse.maven:ctm-267602:$ctm_file"

    //implementation("com.simibubi.create:create-$create_mc_version:$create_version:slim") { transitive = false }
    //implementation "net.createmod.ponder:ponder-neoforge:$ponder_version+mc$create_mc_version"
    //compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-$create_mc_version:$flywheel_version"
    //runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-$create_mc_version:$flywheel_version"
    //implementation "com.tterrag.registrate:Registrate:$registrate_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact

    //the following script is a really sucky way to convert an access widener to an access transformer in lack of a task that PROPERLY does that.
    AccessTransformSet at
    File awFile = loom.accessWidenerPath.get().asFile
    try (BufferedReader reader = Files.newBufferedReader(awFile.toPath(), StandardCharsets.UTF_8)) {
        at = Aw2At.toAccessTransformSet(reader)
    }
    java.nio.file.Path tempPath = java.nio.file.Path.of("temp").toAbsolutePath()
    java.nio.file.Path atPath = tempPath.resolve("META-INF/accesstransformer.cfg")
    Files.createDirectories(atPath.getParent())
    try (Writer writer = new LfWriter(Files.newBufferedWriter(atPath))) {
        AccessTransformFormats.FML.write(writer, at)
    }
    from tempPath.toString()
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
