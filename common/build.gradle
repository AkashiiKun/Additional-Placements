architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/additionalplacements.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modCompileOnly "maven.modrinth:double-slabs:$doubleslabs_version"
    modCompileOnly "maven.modrinth:balm:$balm_version"
    modCompileOnly "maven.modrinth:kleeslabs:$kleeslabs_version"
    modCompileOnly "maven.modrinth:continuity:$continuity_version"

    modCompileOnly "com.simibubi.create:create-fabric-$create_mc_version:$create_version"

    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common-forgeapi:$rootProject.forge_config_api_port_version"
}

def generatedResources = file("src/generated")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}
